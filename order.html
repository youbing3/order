<form id="checkout" class="card"><span class="eyebrow">ONLINE ORDER</span><h2>我要訂購</h2><p class="formIntro">選好商品和數量，再填寫取貨資訊。</p><label for="productSelect">選擇商品</label><select id="productSelect"></select><label for="qty">訂購張數</label><div class="row"><button type="button" id="minus" aria-label="減少一張">−</button><input id="qty" name="qty" type="number" min="1" max="999" value="1" required><button type="button" id="plus" aria-label="增加一張">＋</button></div>

<fieldset id="shipping" hidden disabled><label for="receiver">收件姓名</label><input id="receiver" name="receiver" maxlength="50" required><label for="address">宅配地址</label><input id="address" name="address" maxlength="180" required></fieldset>
<label for="note">訂單備註（選填）</label><textarea id="note" name="note" maxlength="250" rows="2"></textarea>
<div class="total" id="quote" aria-live="polite"></div><button class="wide" id="sendOrder" disabled>送出訂單</button><output id="receipt" aria-live="polite"></output></form></section>

<script src="local-data.js"></script><script>
const get=id=>document.getElementById(id);
let orders=[], members=[];
function showError(error){get('notice').hidden=false;get('notice').textContent=error.message;}
async function reload(){({orders,members}=await api('admin'));render();}
const stages=['待確認','已接單','待自取／出貨','已完成','已取消'];
const money=value=>'NT$'+value.toLocaleString('zh-TW');
const shippingNote=o=>o.delivery==='ship'?'冷凍宅配｜運費 '+money(o.freight??0):'自取｜地點與時間待店家確認';
let product, member, lineId='';
function fillBuyer(){if(member){get('buyer').value=member.name;get('phone').value=member.phone;}}
try{lineId=sessionStorage.getItem('scallion-demo-line-id')||'';}catch{}
async function refreshHistory(){
 const result=await api('history',{lineId});
 member=result.member;
 get('welcome').textContent=member?'你好，'+member.name:'歡迎來到蔥酥小餅';
 get('memberProfile').hidden=!member;
 get('memberProfile').textContent=member?member.name+'｜'+member.phone:'';
 const history=get('history');
 history.replaceChildren();
 get('guestLookup').hidden=Boolean(result.member);
 get('register').hidden=Boolean(result.member);
 get('historyHint').textContent=result.member
  ? (result.orders.length?'依下單時間由新到舊排列。':'目前沒有會員訂單。以這個會員身分下單後，紀錄會顯示在這裡。')
  : '綁定 LINE 並完成會員登記後，即可查看自己的訂購紀錄。';
 if(result.member)get('lineStatus').textContent='已綁定 LINE 測試帳號｜'+result.member.name;
 for(const order of result.orders){
  const card=document.createElement('article'),top=document.createElement('div'),title=document.createElement('strong'),badge=document.createElement('span'),details=document.createElement('p'),date=document.createElement('small');
  card.className='order';top.className='orderTop';badge.className='pill';badge.dataset.status=order.status;
  title.textContent=order.productName+' × '+order.qty;badge.textContent=order.status;top.append(title,badge);
  details.textContent=money(order.total??order.subtotal)+'｜'+(order.delivery==='ship'?'冷凍宅配':'自取')+'｜'+(order.paid?'已收款':'未收款')+(order.gift?'｜贈 '+order.gift:'');
  date.textContent=new Date(order.date).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+' · '+order.id;
  card.append(top,details,date);history.append(card);
 }
}

get('bindLine').onclick=()=>{
 if(!lineId)lineId='demo-line-'+crypto.randomUUID();
 try{sessionStorage.setItem('scallion-demo-line-id',lineId);}catch{}
 get('lineStatus').textContent='已連結 LINE 測試帳號，可以填寫手機號碼。';
 get('joinMember').disabled=!product?.accepting;
 get('bindLine').disabled=true;
 refreshHistory().catch(showError);
};
if(lineId)get('bindLine').click();

get('productPhoto').dataset.fallback=get('productPhoto').src;
get('productSelect').onchange=()=>loadProduct().catch(showError);
async function loadProduct(){
 const items=await api('product');
 const select=get('productSelect'),selected=select.value;
 select.replaceChildren(...items.catalog.map(item=>new Option(item.name,item.id)));
 if(items.catalog.some(item=>item.id===selected))select.value=selected;
 const item=items.catalog.find(row=>row.id===select.value);
 product={...items,...item,accepting:items.accepting&&Boolean(item)};
 get('productPhoto').src=item?.image||get('productPhoto').dataset.fallback;
 get('productPhoto').dataset.default=String(!item?.image);

 get('productName').textContent=product.name||'目前沒有上架商品';
 get('productPrice').textContent=product.price?money(product.price):'—';
 get('sendOrder').disabled=!product.accepting;
 get('joinMember').disabled=!product.accepting||!lineId;
 get('sendOrder').textContent=product.accepting?'送出訂單':'暫停接單';
 get('joinMember').textContent=product.accepting?'完成會員登記':'暫停登記';
 const promo=product.promotion;
 get('promotion').hidden=!promo;
 get('promotion').textContent=promo?'滿 '+money(promo.threshold)+' 贈 '+promo.gift:'';
 if(!product.accepting)showError(new Error('目前暫停接單與會員登記。已成立的訂單仍可查詢。'));
 quote();
}
function freightFor(subtotal,ship){
 return ship&&(product.freeShipping===null||subtotal<product.freeShipping)?product.shippingFee:0;
}
function quote(){
 const qty=Number(get('qty').value);
 const ship=get('delivery').value==='ship';
 get('shipping').hidden=get('shipping').disabled=!ship;
 if(!product)return;
 const subtotal=Number.isInteger(qty)&&qty>=1&&qty<=999?qty*(product.price||0):0;
 const promo=product.promotion;
 const freight=freightFor(subtotal,ship);
 get('quote').textContent='商品小計 '+money(subtotal)+(promo?(subtotal>=promo.threshold?'｜贈 '+promo.gift:'｜再買 '+money(promo.threshold-subtotal)+' 即可獲贈 '+promo.gift):'')+'｜'+(ship?'宅配運費 '+money(freight):'自取免運')+'｜合計 '+money(subtotal+freight)+(ship&&freight>0&&product.freeShipping!==null?'｜再買 '+money(product.freeShipping-subtotal)+' 可免運':'');
}
function summary(o){
 return o.id+'｜'+(o.productName||'蔥酥小餅')+' '+o.qty+' 張｜'+money(o.total??o.subtotal)+'｜'+o.status+'｜'+(o.paid?'已收款':'未收款')+'｜'+shippingNote(o)+((o.gift??(o.subtotal>=300?'保冰袋 1 個':''))?'｜贈 '+(o.gift??'保冰袋 1 個'):'');
}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
 for(const page of ['home','shop','member','historyPage','admin']){const panel=get(page);if(panel)panel.hidden=page!==button.dataset.page;}
 if(button.dataset.page==='member'||button.dataset.page==='historyPage')refreshHistory().catch(showError);
 if(button.dataset.page==='shop'){fillBuyer();loadProduct().catch(showError);}
 document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-current',item===button?'page':'false'));
});
get('qty').oninput=get('delivery').onchange=quote;
get('minus').onclick=()=>{get('qty').stepDown();quote()};
get('plus').onclick=()=>{get('qty').stepUp();quote()};
function submit(id,action){
 const form=get(id);
 if(!form)return;
 form.onsubmit=async event=>{
  event.preventDefault();
  const button=form.querySelector('button:not([type="button"])');
  button.disabled=true;get('notice').hidden=true;
  try{await action(Object.fromEntries(new FormData(form)));}
  catch(error){showError(error);}
  finally{button.disabled=(id==='checkout'||id==='register')&&!product?.accepting||id==='register'&&!lineId;}
 };
}
submit('checkout',async data=>{
 if(!product?.accepting)return;
 let order;
 try{order=await api('order',{...data,lineId,freight:freightFor(Number(data.qty)*product.price,data.delivery==='ship'),productId:product.id,productName:product.name,unitPrice:product.price,promotion:JSON.stringify(product.promotion)});}
 catch(error){if(error.status===409||error.status===503)await loadProduct();throw error;}
 get('checkout').reset();fillBuyer();quote();
 get('receipt').textContent='訂單已送出。'+summary(order);
 await refreshHistory();
});
submit('register',async data=>{
 const result=await api('member',{...data,lineId});
 get('registered').textContent=result.created?'會員登記完成，已綁定 LINE 測試帳號及手機。':'這個 LINE 測試帳號已登記。';
 await refreshHistory();
});
submit('lookup',async data=>{
 const result=await api('lookup',data);
 get('found').textContent=result.order?summary(result.order):'查無訂單，請確認訂單編號與電話。';
});
if(get('filter'))for(const stage of stages)get('filter').add(new Option(stage,stage));
function filtered(orders){
 const keyword=get('search').value.trim().toUpperCase(),status=get('filter').value;
 return orders.filter(o=>(!status||o.status===status)&&[o.buyer,o.phone,o.id].some(value=>value.toUpperCase().includes(keyword)));
}
function render(){
 const active=orders.filter(o=>o.status!=='已取消');
 const sum=list=>list.reduce((total,o)=>total+o.subtotal,0);
 get('stats').replaceChildren();
 for(const [label,value] of [['有效訂單',active.length],['訂購張數',active.reduce((n,o)=>n+o.qty,0)],['訂單商品額',money(sum(active))],['實收商品額',money(sum(orders.filter(o=>o.paid)))],['待收商品額',money(sum(active.filter(o=>!o.paid)))],['會員人數',members.length]]){
  const box=document.createElement('div'),amount=document.createElement('strong');
  amount.textContent=value;box.append(label,amount);get('stats').append(box);
 }
 get('orders').replaceChildren();
 for(const o of filtered(orders)){
  const box=document.createElement('article'),detail=document.createElement('p'),stage=document.createElement('select'),paid=document.createElement('button');
  box.className='order';
  detail.textContent=[o.buyer,o.phone,summary(o),o.receiver,o.address,o.note].filter(Boolean).join('｜');
  stage.setAttribute('aria-label','訂單狀態');
  for(const s of stages)stage.add(new Option(s,s,false,s===o.status));
  stage.onchange=()=>api('admin/update',{id:o.id,status:stage.value}).then(reload).catch(error=>{stage.value=o.status;showError(error)});
  paid.textContent=o.paid?'取消收款標記':'標記已收商品款';
  paid.onclick=()=>api('admin/update',{id:o.id,paid:!o.paid}).then(reload).catch(showError);
  box.append(detail,stage,paid);get('orders').append(box);
 }
 if(!get('orders').children.length)get('orders').textContent='目前沒有符合條件的訂單。';
 get('members').replaceChildren();
 for(const member of members){const p=document.createElement('p');p.textContent=member.name+'｜'+member.phone;get('members').append(p)}
 if(!members.length)get('members').textContent='目前沒有會員。';
}
if(get('admin')){get('search').oninput=get('filter').onchange=render;
get('export').onclick=()=>{
 const rows=[['單號','日期','姓名','電話','張數','商品小計','取貨方式','收件人','地址','狀態','商品款','備註'],...filtered(orders).map(o=>[o.id,o.date,o.buyer,o.phone,o.qty,o.subtotal,shippingNote(o),o.receiver,o.address,o.status,o.paid?'已收':'未收',o.note])];
 const csv=rows.map(row=>row.map(value=>{const s=String(value??'');return '"'+(/^[\s]*[=+@-]|^[\t\r\n]/.test(s)?"'":'')+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='scallion-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
reload().catch(showError);}
else loadProduct().catch(showError);
</script></html>
