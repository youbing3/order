<style>

space:nowrap}.pill[data-status="待確認"]{background:#fff1d8;color:#7a4a09}.pill[data-status="已確認"]{background:#e9f1ff;color:#264c90}.pill[data-status="已取消"]{background:#fceaea;color:#8e3535}.orderTop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.order{border:1px solid var(--edge);border-radius:14px;padding:14px;background:#fff;overflow-wrap:anywhere}.order p{margin:6px 0;color:var(--muted)}[hidden]{display:none!important}

header{background:#fff;border-bottom:1px solid var(--edge);min-height:72px;padding:12px max(calc((100vw - 1080px)/2),20px);display:flex;justify-content:space-between;align-items:center;gap:10px}.wordmark{display:flex;align-items:center;gap:9px;white-space:nowrap}.wordmark i{font-style:normal;color:#155a44;background:#e8f6ef;border-radius:11px;padding:6px 9px}.wordmark b{font-size:17px}header nav button{background:#f2f5f8;color:#425369;font-size:13px;min-height:36px;padding:6px 11px}header nav button:hover,header nav button[aria-current=page]{background:#e5f5ec;color:#165440}main{max-width:1120px;padding:26px 20px 48px;margin:auto}.demo{font-size:12px;color:#607184;margin-bottom:15px;display:flex;gap:8px;align-items:center}.demo:before{content:'';width:7px;height:7px;border-radius:50%;background:#4f9a7d}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;gap:20px}.hero{padding:0;overflow:hidden}.photoFrame{height:clamp(175px,26vw,335px);overflow:hidden;background:#f3f7f4;position:relative}.photoFrame img{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block}.photoFrame img[data-default=true]{position:absolute;width:168%;height:auto;left:-8%;top:50%;transform:translateY(-40%)}.heroBody{padding:24px}.hero h1{font-size:clamp(33px,5vw,51px);line-height:1.08;letter-spacing:-.06em;margin:5px 0 12px}.price{font-size:29px;color:#17634b;letter-spacing:-.03em}.heroCopy{color:#617080;margin:10px 0 0}.hero #promotion{background:#fff4dc;padding:10px 13px;border-radius:10px;color:#694615;margin-top:13px;font-weight:750}.formIntro{color:var(--muted);margin-bottom:18px}.total{padding:14px;margin:17px 0 12px;background:#eef7f3;color:#174938;border-radius:11px;font-weight:750}.memberGrid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px;margin-top:19px}.memberPane{border:1px solid var(--edge);border-radius:15px;padding:18px}.memberPane h2{font-size:21px}.memberPane details{margin-top:16px}.memberPane summary{cursor:pointer;color:#17634b;font-weight:700}#lineStatus{padding:8px 10px;background:#eff7f3;border-radius:9px;font-size:13px}#history{display:grid;gap:8px}#bindLine{background:#17634b!important}
@media(max-width:700px){header{min-height:59px;padding:8px 12px}.wordmark b{font-size:14px}header nav{gap:4px}header nav button{font-size:12px;padding:5px 7px}main{padding:15px 12px 36px}.grid,.memberGrid{grid-template-columns:1fr;gap:12px}.card{padding:17px;border-radius:17px}.hero{padding:0}.heroBody{padding:16px}.photoFrame{height:175px}.hero h1{font-size:33px}}
.homeMenu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:20px}.homeMenu button{text-align:left;background:#f4faf7;border-color:#dcece3;color:#164838;padding:16px;font-size:19px}.homeMenu button:hover{background:#e6f5ed}.homeMenu span,.homeMenu small{display:block;font-size:12px;margin:5px 0}@media(max-width:600px){.homeMenu{grid-template-columns:1fr}}.homeMascot{float:right;width:clamp(64px,20vw,120px);border-radius:18px;margin:0 0 8px 8px}.homeMenu{clear:both;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.homeMenu button{aspect-ratio:1;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:5px;font-size:clamp(13px,3.7vw,21px);line-height:1.2}.homeMenu button:nth-child(2){background:#fff4d9;border-color:#f4dfaa;color:#674514}.homeMenu svg{width:clamp(27px,8vw,49px);height:auto}.homeMenu small{display:none}.homeMenu{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}.homeMenu svg{width:clamp(38px,11vw,63px)}.homeMenu button{font-size:clamp(16px,4.4vw,23px)}#shop{display:block}.productCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.productCard{min-width:0;padding:10px;border:1px solid var(--edge);border-radius:14px;background:#fff}.productCard[data-selected=true]{border-color:#4f9a7d;background:#f4faf7}.productCard img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#f5f7f5}.productCard h3{font-size:17px;margin:8px 0 4px;overflow-wrap:anywhere}.productCard strong{color:var(--green)}.productStepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;text-align:center;margin-top:8px}.productStepper button{padding:0;min-height:44px}.productStepper output{margin:0;padding:0;background:none}</style>
<header><span class="wordmark"><i>蔥</i><b>蔥酥小餅</b></span><nav><button data-page="home" aria-current="page">首頁</button></nav></header>
<main><div id="notice" class="banner" hidden role="alert"></div>
<section id="home" class="card"><span class="eyebrow">MEMBER CENTER</span><img class="homeMascot" src="mascot.png" alt=""><h2 id="welcome">歡迎來到蔥酥小餅</h2><p class="muted">請選擇你想使用的功能。</p><div class="homeMenu"><button data-page="member"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2 M16 7a4 4 0 1 1-8 0 4 4 0 1 1 8 0"/></svg>會員資料<small>LINE 綁定、姓名與手機</small></button><button data-page="shop"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2 12h12l2-9H6 M9 21h.01 M18 21h.01"/></svg>我要訂購<small>選商品、宅配或自取</small></button><button data-page="historyPage"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l3 3v15H4V3h3 M8 9h8 M8 13h8 M8 17h5"/></svg>歷史訂單<small>查看訂購紀錄和處理進度</small></button></div></section><section id="shop" class="grid" hidden>
<form id="checkout" class="card"><span class="eyebrow">ONLINE ORDER</span><h2>我要訂購</h2><p class="formIntro">點商品的 ＋ 選擇品項和張數，每筆訂單選一種商品。</p><div id="productCards" class="productCards" aria-label="商品"></div><p id="promotion" class="total" hidden></p><input id="qty" name="qty" type="hidden" value="0"><hr><h3>訂購人資料</h3>
<label for="buyer">訂購姓名</label><input id="buyer" name="buyer" maxlength="50" required>
<label for="phone">聯絡電話</label><input id="phone" name="phone" type="tel" inputmode="tel" required pattern="[0-9]{8,10}" placeholder="8–10 碼數字">
<label for="delivery">取貨方式</label><select name="delivery" id="delivery"><option value="pickup">自取</option><option value="ship">冷凍宅配</option></select>
<fieldset id="shipping" hidden disabled><label for="receiver">收件姓名</label><input id="receiver" name="receiver" maxlength="50" required><label for="address">宅配地址</label><input id="address" name="address" maxlength="180" required></fieldset>
<label for="note">訂單備註（選填）</label><textarea id="note" name="note" maxlength="250" rows="2"></textarea>
<div class="total" id="quote" aria-live="polite"></div><button class="wide" id="sendOrder" disabled>送出訂單</button><output id="receipt" aria-live="polite"></output></form></section>
<section id="member" class="card" hidden><span class="eyebrow">MEMBER CENTER</span><h2>會員資料</h2><p id="memberProfile" hidden></p><p>想收到訂單確認卡片，請<a href="https://line.me/R/ti/p/%40176ssazl">加入蔥酥小餅官方帳號好友</a>。</p><p id="notificationStatus" aria-live="polite" hidden></p><p><button id="verifyNotification" type="button" hidden>重新驗證 LINE 通知</button></p><article class="memberPane"><h2>加入會員</h2><p class="muted">先綁定 LINE，再填寫姓名與台灣手機號碼。</p><p><button type="button" id="bindLine" style="background:#087e43">使用 LINE 登入並綁定</button></p><p id="lineStatus" aria-live="polite">尚未綁定 LINE</p><form id="register" hidden><img id="lineAvatar" alt="LINE 頭像" width="56" height="56" hidden style="border-radius:50%;object-fit:cover"><label>姓名<input name="buyer" autocomplete="name" maxlength="50" required></label><label>手機號碼<input name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="09xxxxxxxx" required pattern="09[0-9]{8}" maxlength="10" autocomplete="tel-national"></label><p><button id="joinMember" disabled>完成會員登記</button></p><output id="registered" aria-live="polite"></output></form></article></section><section id="historyPage" class="card" hidden><span class="eyebrow">ORDER HISTORY</span><h2>歷史訂單</h2><article class="memberPane"><p id="historyHint" class="muted" aria-live="polite">綁定 LINE 並完成會員登記後，即可查看自己的訂購紀錄。</p><div id="history"></div><details id="guestLookup"><summary>訪客訂單查詢</summary><form id="lookup"><label>訂單編號<input name="id" required></label><label>訂購電話<input name="phone" type="tel" required pattern="[0-9]{8,10}"></label><p><button>查詢</button></p><output id="found"></output></form></details></article></section>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="config.js"></script><script src="remote.js"></script><script>
const get=id=>document.getElementById(id);
let orders=[], members=[];
function showError(error){get('notice').hidden=false;get('notice').textContent=error.message;}
async function reload(){({orders,members}=await api('admin'));render();}
const stages=['待確認','已接單','待自取／出貨','已完成','已取消'];
const money=value=>'NT$'+value.toLocaleString('zh-TW');
const shippingNote=o=>o.delivery==='ship'?'冷凍宅配｜運費 '+money(o.freight??0):'自取｜地點與時間待店家確認';
let product, member, lineId='', requestId=crypto.randomUUID();
function fillBuyer(){if(member){get('buyer').value=member.name;get('phone').value=member.phone;}}
async function refreshHistory(){
 const result=await api('history');
 member=result.member;
 get('notificationStatus').hidden=!member;
 get('notificationStatus').textContent=result.lineNotifications?'LINE 通知收件人已設定。':'尚未設定 LINE 通知收件人。';
 get('verifyNotification').hidden=!member||result.lineNotifications;
 get('welcome').textContent=member?'你好，'+member.name:'歡迎來到蔥酥小餅';
 get('memberProfile').hidden=!member;
 get('memberProfile').textContent=member?member.name+'｜'+member.phone:'';
 const history=get('history');
 history.replaceChildren();
 get('guestLookup').hidden=Boolean(result.member);
 get('register').hidden=Boolean(result.member)||!lineId;
 get('historyHint').textContent=result.member
  ? (result.orders.length?'依下單時間由新到舊排列。':'目前沒有會員訂單。以這個會員身分下單後，紀錄會顯示在這裡。')
  : '綁定 LINE 並完成會員登記後，即可查看自己的訂購紀錄。';
 if(result.member)get('lineStatus').textContent='已綁定 LINE 帳號｜'+result.member.name;
 for(const order of result.orders){
  const card=document.createElement('article'),top=document.createElement('div'),title=document.createElement('strong'),badge=document.createElement('span'),details=document.createElement('p'),date=document.createElement('small');
  card.className='order';top.className='orderTop';badge.className='pill';badge.dataset.status=order.status;
  title.textContent=order.productName+' × '+order.qty;badge.textContent=order.status;top.append(title,badge);
  details.textContent=money(order.total??order.subtotal)+'｜'+(order.delivery==='ship'?'冷凍宅配':'自取')+'｜'+(order.paid?'已收款':'未收款')+(order.gift?'｜贈 '+order.gift:'');
  date.textContent=new Date(order.date).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+' · '+order.id;
  card.append(top,details,date);history.append(card);
 }
}

async function startLine(interactive){
 let connected;
 try{
  connected=await connectLine(interactive);
 }catch(error){
  if(interactive||error.code!=='functions/unauthenticated'||
     error.message!=='LINE 登入已失效，請重新開啟會員專區。')throw error;
  const {member:signedInMember}=await api('history').catch(()=>({}));
  if(!signedInMember)throw error;
  connected=true;
 }
 if(!connected)return;
 lineId='verified';
 get('lineStatus').textContent='LINE 已登入。';
 get('bindLine').hidden=true;
 await refreshHistory();
 if(!member&&window.liff?.isLoggedIn()){
  const profile=await liff.getProfile().catch(()=>null);
  const name=get('register').elements.buyer;
  if(profile?.displayName&&!name.value)name.value=profile.displayName.slice(0,name.maxLength);
  const avatar=get('lineAvatar');
  if(profile?.pictureUrl?.startsWith('https://')){
   avatar.onerror=()=>{avatar.hidden=true;};
   avatar.src=profile.pictureUrl;
   avatar.hidden=false;
  }
 }
 fillBuyer();
 get('joinMember').disabled=!product?.accepting;
}
get('verifyNotification').onclick=async()=>{
 const button=get('verifyNotification');
 button.disabled=true;
 try{
  lineInit??=window.liff.init({liffId:websiteConfig.liffId});
  await lineInit;
  if(liff.isInClient()){
   await startLine(true);
   return;
  }
  if(liff.isLoggedIn())liff.logout();
  liff.login({redirectUri:new URL('/#line-notification',location.origin).href});
 }catch(error){
  showError(error);
 }finally{button.disabled=false;}
};
get('bindLine').onclick=()=>startLine(true).catch(showError);
let catalog=[];
function renderProducts(){
 const cards=get('productCards');
 cards.replaceChildren();
 if(!catalog.length){cards.textContent='目前沒有上架商品';return;}
 for(const item of catalog){
  const card=document.createElement('article'),image=document.createElement('img'),name=document.createElement('h3'),price=document.createElement('strong'),stepper=document.createElement('div');
  const selected=item.id===product.id,qty=selected?Number(get('qty').value):0;
  card.className='productCard';card.dataset.selected=String(qty>0);
  image.alt=item.name;image.src=item.image||'mascot.png';
  image.onerror=()=>{image.onerror=null;image.src='mascot.png';};
  name.textContent=item.name;price.textContent=money(item.price)+'／張';
  stepper.className='productStepper';
  const minus=document.createElement('button'),plus=document.createElement('button'),count=document.createElement('output');
  minus.type=plus.type='button';minus.textContent='−';plus.textContent='＋';count.textContent=qty;
  minus.setAttribute('aria-label','減少 '+item.name);plus.setAttribute('aria-label','增加 '+item.name);
  minus.disabled=qty===0;plus.disabled=!product.accepting||qty>=999;
  function setQuantity(next,control){
   product={...product,id:item.id,name:item.name,price:item.price};
   get('qty').value=next;renderProducts();quote();
   const buttons=cards.children[catalog.indexOf(item)].querySelectorAll('button');
   (buttons[control].disabled?buttons[1-control]:buttons[control]).focus();
  }
  minus.onclick=()=>setQuantity(qty-1,0);plus.onclick=()=>setQuantity(qty+1,1);
  stepper.append(minus,count,plus);card.append(image,name,price,stepper);cards.append(card);
 }
}
async function loadProduct(){
 const items=await api('product');
 catalog=items.catalog;
 const item=catalog.find(row=>row.id===product?.id);
 if(!item)get('qty').value=0;
 product={...items,...item};
 renderProducts();
 get('joinMember').disabled=!product.accepting||!lineId;
 get('sendOrder').textContent=product.accepting?'送出訂單':'暫停接單';
 get('joinMember').textContent=product.accepting?'完成會員登記':'暫停登記';
 const promo=product.promotion;
 get('promotion').hidden=!promo;
 get('promotion').textContent=promo?'滿 '+money(promo.threshold)+' 贈 '+promo.gift:'';
 if(!product.accepting)showError(new Error('目前暫停接單與會員登記。已成立的訂單仍可查詢。'));
 quote();
}
function freightFor(subtotal,ship){
 return ship&&(product.freeShipping===null||subtotal<product.freeShipping)?product.shippingFee:0;
}
function quote(){
 const qty=Number(get('qty').value);
 get('sendOrder').disabled=!product?.accepting||qty<1;
 const ship=get('delivery').value==='ship';
 get('shipping').hidden=get('shipping').disabled=!ship;
 if(!product)return;
 const subtotal=Number.isInteger(qty)&&qty>=1&&qty<=999?qty*(product.price||0):0;
 const promo=product.promotion;
 const freight=freightFor(subtotal,ship);
 get('quote').textContent='商品小計 '+money(subtotal)+(promo?(subtotal>=promo.threshold?'｜贈 '+promo.gift:'｜再買 '+money(promo.threshold-subtotal)+' 即可獲贈 '+promo.gift):'')+'｜'+(ship?'宅配運費 '+money(freight):'自取免運')+'｜合計 '+money(subtotal+freight)+(ship&&freight>0&&product.freeShipping!==null?'｜再買 '+money(product.freeShipping-subtotal)+' 可免運':'');
}
function summary(o){
 return o.id+'｜'+(o.productName||'蔥酥小餅')+' '+o.qty+' 張｜'+money(o.total??o.subtotal)+'｜'+o.status+'｜'+(o.paid?'已收款':'未收款')+'｜'+shippingNote(o)+((o.gift??(o.subtotal>=300?'保冰袋 1 個':''))?'｜贈 '+(o.gift??'保冰袋 1 個'):'');
}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
 if(!member&&['home','shop','historyPage'].includes(button.dataset.page)){
  document.querySelector('[data-page="member"]')?.click();
  return;
 }
 for(const page of ['home','shop','member','historyPage','admin']){const panel=get(page);if(panel)panel.hidden=page!==button.dataset.page;}
 if(button.dataset.page==='member'||button.dataset.page==='historyPage')refreshHistory().catch(showError);
 if(button.dataset.page==='shop'){fillBuyer();loadProduct().catch(showError);}
 document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-current',item===button?'page':'false'));
});
get('delivery').onchange=quote;
function submit(id,action){
 const form=get(id);
 if(!form)return;
 form.onsubmit=async event=>{
  event.preventDefault();
  const button=form.querySelector('button:not([type="button"])');
  button.disabled=true;get('notice').hidden=true;
  try{await action(Object.fromEntries(new FormData(form)));}
  catch(error){showError(error);}
  finally{button.disabled=(id==='checkout'||id==='register')&&!product?.accepting||id==='register'&&!lineId||id==='checkout'&&Number(get('qty').value)<1;}
 };
}
submit('checkout',async data=>{
 if(!member){document.querySelector('[data-page="member"]')?.click();return;}
 if(!product?.accepting||!product.id||Number(data.qty)<1)return;
 let order;
 try{order=await api('order',{...data,requestId,freight:freightFor(Number(data.qty)*product.price,data.delivery==='ship'),productId:product.id,productName:product.name,unitPrice:product.price,promotion:JSON.stringify(product.promotion)});}
 catch(error){if(error.status===409||error.status===503)await loadProduct();throw error;}
 requestId=crypto.randomUUID();
 get('checkout').reset();fillBuyer();renderProducts();quote();
 get('receipt').textContent='訂單已送出。'+summary(order);
 await refreshHistory();
});
submit('register',async data=>{
 const result=await api('member',data);
 get('registered').textContent=result.created?'會員登記完成，已綁定 LINE 帳號及手機。':'這個 LINE 帳號已登記。';
 await refreshHistory();
 if(member)document.querySelector('[data-page="home"]')?.click();
});
submit('lookup',async data=>{
 const result=await api('lookup',data);
 get('found').textContent=result.order?summary(result.order):'查無訂單，請確認訂單編號與電話。';
});
if(get('filter'))for(const stage of stages)get('filter').add(new Option(stage,stage));
function filtered(orders){
 const keyword=get('search').value.trim().toUpperCase(),status=get('filter').value;
 return orders.filter(o=>(!status||o.status===status)&&[o.buyer,o.phone,o.id].some(value=>value.toUpperCase().includes(keyword)));
}
function render(){
 const active=orders.filter(o=>o.status!=='已取消');
 const sum=list=>list.reduce((total,o)=>total+o.subtotal,0);
 get('stats').replaceChildren();
 for(const [label,value] of [['有效訂單',active.length],['訂購張數',active.reduce((n,o)=>n+o.qty,0)],['訂單商品額',money(sum(active))],['實收商品額',money(sum(orders.filter(o=>o.paid)))],['待收商品額',money(sum(active.filter(o=>!o.paid)))],['會員人數',members.length]]){
  const box=document.createElement('div'),amount=document.createElement('strong');
  amount.textContent=value;box.append(label,amount);get('stats').append(box);
 }
 get('orders').replaceChildren();
 for(const o of filtered(orders)){
  const box=document.createElement('article'),detail=document.createElement('p'),stage=document.createElement('select'),paid=document.createElement('button');
  box.className='order';
  detail.textContent=[o.buyer,o.phone,summary(o),o.receiver,o.address,o.note].filter(Boolean).join('｜');
  stage.setAttribute('aria-label','訂單狀態');
  for(const s of stages)stage.add(new Option(s,s,false,s===o.status));
  stage.onchange=()=>api('admin/update',{id:o.id,status:stage.value}).then(reload).catch(error=>{stage.value=o.status;showError(error)});
  paid.textContent=o.paid?'取消收款標記':'標記已收商品款';
  paid.onclick=()=>api('admin/update',{id:o.id,paid:!o.paid}).then(reload).catch(showError);
  box.append(detail,stage,paid);get('orders').append(box);
 }
 if(!get('orders').children.length)get('orders').textContent='目前沒有符合條件的訂單。';
 get('members').replaceChildren();
 for(const member of members){const p=document.createElement('p');p.textContent=member.name+'｜'+member.phone;get('members').append(p)}
 if(!members.length)get('members').textContent='目前沒有會員。';
}
if(get('admin')){get('search').oninput=get('filter').onchange=render;
get('export').onclick=()=>{
 const rows=[['單號','日期','姓名','電話','張數','商品小計','取貨方式','收件人','地址','狀態','商品款','備註'],...filtered(orders).map(o=>[o.id,o.date,o.buyer,o.phone,o.qty,o.subtotal,shippingNote(o),o.receiver,o.address,o.status,o.paid?'已收':'未收',o.note])];
 const csv=rows.map(row=>row.map(value=>{const s=String(value??'');return '"'+(/^[\s]*[=+@-]|^[\t\r\n]/.test(s)?"'":'')+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='scallion-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
reload().catch(showError);}
else{
 get('home').hidden=true;
 get('member').hidden=false;
 startLine(false).catch(showError).then(()=>{
 if(member&&location.hash!=='#line-notification'&&location.hash!=='#history')document.querySelector('[data-page="home"]')?.click();
 if(location.hash==='#line-notification')document.querySelector('[data-page="member"]')?.click();
 if(location.hash==='#history')document.querySelector('[data-page="historyPage"]')?.click();
 return loadProduct();
 }).catch(showError);
}
</script></html>
