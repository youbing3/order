<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>蔥酥小餅｜線上訂購</title>
<style>
:root{--ink:#14202b;--green:#17634b;--green-dark:#104a39;--mint:#e9f7f1;--paper:#fff;--cream:#f7f9fb;--edge:#e3e9ef;--muted:#546376;--gold:#ffc763}
*{box-sizing:border-box}body{margin:0;background:#f7f9fb;color:var(--ink);font:15px/1.55 system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}button,input,select,textarea{font:inherit}a{color:var(--green)}h1,h2,h3,p{margin:0 0 12px}h2{font-size:clamp(24px,4vw,33px);line-height:1.18;letter-spacing:-.035em}h3{font-size:20px}.muted,small{color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap}.eyebrow{display:block;color:#267056;font-size:11px;font-weight:800;letter-spacing:.14em;margin:0 0 7px}.card{background:white;border:1px solid var(--edge);border-radius:23px;padding:26px;box-shadow:0 4px 18px #23384f07}.banner{font-size:13px;background:#fff4dd;color:#694615;border:1px solid #f4ddb1;border-radius:12px;padding:10px 14px;margin-bottom:16px}label{display:block;font-weight:650;font-size:14px;margin:13px 0 5px}input:not([type=checkbox]),select,textarea{display:block;width:100%;min-height:44px;border:1px solid #d9e2ea;border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink)}input[type=checkbox]{accent-color:var(--green)}input::placeholder,textarea::placeholder{color:#6a7786}button{border:1px solid transparent;background:#17634b;color:#fff;font-weight:700;border-radius:10px;min-height:41px;padding:9px 14px;cursor:pointer}button:hover:not(:disabled){background:#104a39}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #61a88d;outline-offset:2px}.wide{width:100%}.row{display:flex;align-items:center;gap:8px}.row>*{flex:1;min-width:0}.row button{flex:0;min-width:44px}.row input{text-align:center}fieldset{padding:0;border:0;margin:0;min-width:0}hr{border:0;border-top:1px solid var(--edge);margin:20px 0}output:not(:empty){display:block;background:var(--mint);border-radius:10px;padding:10px 12px;margin-top:10px}.pill{font-weight:750;font-size:12px;padding:5px 9px;border-radius:999px;color:#185b47;background:#e7f6ee;white-space:nowrap}.pill[data-status="待確認"]{background:#fff1d8;color:#7a4a09}.pill[data-status="已確認"]{background:#e9f1ff;color:#264c90}.pill[data-status="已取消"]{background:#fceaea;color:#8e3535}.orderTop{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.order{border:1px solid var(--edge);border-radius:14px;padding:14px;background:#fff;overflow-wrap:anywhere}.order p{margin:6px 0;color:var(--muted)}[hidden]{display:none!important}

.console{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}.rail{background:#fff;border-right:1px solid var(--edge);padding:22px 14px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:9px;padding:0 6px}.brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#e7f6ee;color:#17634b;font-size:21px;font-weight:800}.brand strong,.brand small{display:block}.brand small{font-size:10px;letter-spacing:.1em}.rail nav{display:grid;gap:4px}.rail nav a{display:flex;align-items:center;gap:9px;text-decoration:none;color:#45566a;font-weight:680;padding:10px;border-radius:9px}.rail nav a .navIcon{display:grid;place-items:center;width:22px;height:22px;color:#5b6c7e}.rail nav a svg{width:17px;height:17px}.rail nav a[aria-current=page]{background:#e9f6ef;color:#185b46}.rail nav a[aria-current=page] .navIcon{color:#185b46}.rail nav a:hover{background:#eff5f5}.railFooter{margin-top:auto;padding:10px}.workspace{min-width:0;padding:0 clamp(18px,4vw,54px) 42px}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:66px;border-bottom:1px solid var(--edge);margin-bottom:23px;color:#56687b;font-size:13px}.mode{color:#40546b;background:white;border:1px solid var(--edge);border-radius:999px;padding:5px 9px;font-weight:650}#admin.card{padding:0;border:0;background:transparent;box-shadow:none}#heading{font-size:clamp(27px,4vw,42px);margin-bottom:7px}#description{max-width:680px;margin-bottom:20px}.overview,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:15px 0 22px}.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.overview div,.stats div{background:#fff;border:1px solid var(--edge);border-radius:15px;padding:13px 15px;color:#56687b;font-size:13px}.overview strong,.stats strong{display:block;margin-top:3px;font-size:25px;color:#182c38;font-variant-numeric:tabular-nums}.overview div:first-child{border-color:#f0ddb5;background:#fff9ed}#orders{display:grid;gap:8px}.order{padding:13px 15px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{min-height:35px;font-size:13px;padding:6px 10px}.actions button+button,#newProduct{background:#eef3f7;color:#354c63}.actions button+button:hover,#newProduct:hover{background:#e0e9f1}#criteria,#storeForm,#productForm{border:1px solid var(--edge);background:white;border-radius:15px;padding:15px;margin:12px 0}#catalog p,#members p{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--edge);border-radius:12px;padding:11px 13px;background:white}#catalog img{width:44px;height:44px;border-radius:8px;object-fit:cover}#imagePreview{margin-top:8px}
@media(max-width:760px){.console{display:block}.rail{padding:11px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--edge)}.rail nav{display:flex;flex-wrap:nowrap;overflow:auto}.rail nav a{padding:7px 8px;font-size:12px;white-space:nowrap}.rail nav a .navIcon{width:15px}.rail nav a svg{width:14px;height:14px}.railFooter{display:none}.workspace{padding:0 12px 33px}.topline{min-height:48px;margin-bottom:16px}.overview{gap:5px}.overview div{padding:8px;font-size:11px}.overview strong{font-size:20px}}
</style>
<section id="loginGate" class="card" style="max-width:420px;margin:10vh auto;padding:24px"><h2>店家管理登入</h2><form id="adminCredentials"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>密碼<input name="password" type="password" autocomplete="current-password" required></label><button id="loginAdmin" type="submit" style="margin-top:14px">登入</button><output id="loginError" aria-live="polite"></output></form></section><main id="adminConsole" class="console" hidden><aside class="rail"><div class="brand"><span class="brandmark">蔥</span><div><strong>蔥酥小餅</strong><small>STORE CONSOLE</small></div></div><nav aria-label="管理功能"><a href="#orders"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5"/></svg></span>訂單頁面</a><a href="#search"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0z M15 15l5 5"/></svg></span>查詢訂單</a><a href="#members"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0z M5 21v-2a7 5 0 0 1 14 0v2"/></svg></span>會員資料</a><a href="#revenue"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16 M7 15v-3 M12 15V8 M17 15V5"/></svg></span>收入統計</a><a href="#sessions">登入裝置</a><a href="#products"><span class="navIcon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7l8-4 8 4v10l-8 4-8-4z M4 7l8 4 8-4 M12 11v10"/></svg></span>商品設定</a></nav><small class="railFooter">店家管理工作區</small></aside><div class="workspace"><div class="topline"><span>店家後台 / 管理工作區</span><div><button id="logoutAdmin" hidden>登出</button></div></div><div id="notice" class="banner" hidden role="alert"></div><section id="admin" class="card"><span class="eyebrow">STORE MANAGEMENT</span><h2 id="heading"></h2><p id="description" class="muted"></p><div id="sessions" hidden></div><div id="overview" class="overview" hidden></div><div id="stats" class="stats"></div><div id="criteria"><label>搜尋姓名、電話、單號<input id="search"></label><label>訂單狀態<select id="filter"><option value="">全部</option></select></label><p><button id="export">匯出訂單 CSV</button></p></div><div id="orders"></div><div id="members"></div><div id="catalog" hidden></div><form id="productForm" hidden><h3 id="editorTitle">新增商品</h3><input name="id" type="hidden"><label>商品圖片（JPG、PNG、WebP）<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="imagePreview" alt="商品預覽" hidden style="width:120px;border-radius:8px"><label>商品名稱<input name="name" required maxlength="60"></label><label>單價（NT$／張）<input name="price" type="number" min="1" max="100000" required></label><label><input name="active" type="checkbox" checked> 商品上架</label><p><button id="saveProduct">儲存商品</button> <button id="newProduct" type="button">新增另一項</button></p><output id="productSaved" aria-live="polite"></output></form><form id="storeForm" hidden><hr><h2>宅配與免運</h2><label>宅配運費（NT$）<input name="shippingFee" type="number" min="0" max="100000" required></label><label>免運門檻（NT$，留空代表無門檻優惠）<input name="freeShipping" type="number" min="1" max="99999999"></label><hr><h2>接單與期間活動</h2><label><input name="accepting" type="checkbox"> 開放下單與會員登記</label><label><input name="enabled" type="checkbox"> 啟用滿額贈活動</label><label>贈品名稱<input name="gift" maxlength="60" required></label><label>滿額門檻（NT$）<input name="threshold" type="number" min="1" max="99999999" required></label><label>開始日期（台灣時間）<input name="start" type="date"></label><label>結束日期（含當天）<input name="end" type="date"></label><p><button id="saveStore" disabled>儲存接單與活動設定</button></p><output id="storeSaved" aria-live="polite"></output></form></section></div></main>
<script src="../config.js"></script><script src="../remote.js"></script><script>
const get=id=>document.getElementById(id);
let orders=[], members=[];
function showError(error){get('notice').hidden=false;get('notice').textContent=error.message;}
async function reload(){({orders,members}=await api('admin'));render();}
const stages=['待確認','已確認','已出貨','已取貨','已完成','已取消'];
const money=value=>'NT$'+value.toLocaleString('zh-TW');
const shippingNote=o=>o.delivery==='ship'?'冷凍宅配｜運費 '+money(o.freight??0):'自取｜地點與時間待店家確認';
function quote(){
 const qty=Number(get('qty').value);
 const ship=get('delivery').value==='ship';
 get('shipping').hidden=get('shipping').disabled=!ship;
 const subtotal=Number.isInteger(qty)&&qty>=1&&qty<=999?qty*25:0;
 get('quote').textContent='商品小計 '+money(subtotal)+'｜'+(subtotal>=300?'贈保冰袋 1 個':'再買 '+money(300-subtotal)+' 即可獲贈保冰袋')+(ship?'｜冷凍運費另計，待店家確認':'');
}
function summary(o){
 return o.id+'｜'+(o.productName||'蔥酥小餅')+' '+o.qty+' 張｜'+money(o.subtotal)+'｜'+o.status+'｜'+(o.paid?'已收款':'未收款')+'｜'+shippingNote(o)+((o.gift??(o.subtotal>=300?'保冰袋 1 個':''))?'｜贈 '+(o.gift??'保冰袋 1 個'):'');
}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>{
 for(const page of ['shop','member','admin'])get(page).hidden=page!==button.dataset.page;
 if(button.dataset.page==='admin')render();
});
if(get('qty')){get('qty').oninput=get('delivery').onchange=quote;
get('minus').onclick=()=>{get('qty').stepDown();quote()};
get('plus').onclick=()=>{get('qty').stepUp();quote()};}
function submit(id,action){
 const form=get(id);
 if(!form)return;
 form.onsubmit=async event=>{
  event.preventDefault();
  const button=form.querySelector('button:not([type="button"])');
  button.disabled=true;get('notice').hidden=true;
  try{await action(Object.fromEntries(new FormData(form)));}
  catch(error){showError(error);}
  finally{button.disabled=false;}
 };
}
submit('checkout',async data=>{
 const order=await api('order',data);
 get('checkout').reset();quote();
 get('receipt').textContent='訂單已送出。'+summary(order);
});
submit('register',async data=>{
 const result=await api('member',data);
 get('registered').textContent=result.created?'已完成會員登記。':'此電話已登記。';
});
submit('lookup',async data=>{
 const result=await api('lookup',data);
 get('found').textContent=result.order?summary(result.order):'查無訂單，請確認訂單編號與電話。';
});
get('adminCredentials').onsubmit=async event=>{
 event.preventDefault();
 const form=event.currentTarget,button=get('loginAdmin');
 button.disabled=true;get('loginError').textContent='';
 try{await adminLogin(form.elements.email.value.trim(),form.elements.password.value);}
 catch(error){get('loginError').textContent=error.code?.startsWith('auth/')?'登入失敗，請確認 Email 和密碼。':error.message;}
 finally{button.disabled=false;}
};
get('logoutAdmin').onclick=()=>adminLogout().catch(showError);
const adminReady=connection.then(async ({auth})=>{
 const user=auth.currentUser;
 if(!user)return false;
 const token=await user.getIdTokenResult();
 if(token.signInProvider!=='password'||token.claims.email_verified!==true)return false;
 if(!sessionStorage.getItem('store-admin-session'))return false;
 await api('admin/session/ping');
 get('loginGate').hidden=true;get('adminConsole').hidden=false;get('logoutAdmin').hidden=false;
 return true;
}).catch(error=>{get('loginError').textContent=error.message;return false;});
const view=location.hash.slice(1)||'orders';
window.addEventListener('hashchange',()=>location.reload());
const sections={
 orders:['訂單頁面','新訂單會先顯示「待確認」。請先確認訂單，再依取貨方式標記出貨或取貨。'],
 search:['查詢訂單','依姓名、電話、單號或狀態查詢歷史訂單。'],
 members:['會員資料','查看已登記會員的姓名與電話。'],
 revenue:['收入統計','以訂單合計統計，包含宅配運費。'],
 products:['商品設定','修改客戶頁販售的商品名稱與單價。新售價適用於之後送出的訂單。']
};
const [heading,description]=view==='sessions'?['登入裝置','顯示最近三分鐘內仍有活動的管理工作階段。']:sections[view]||sections.orders;
get('heading').textContent=heading;
get('description').textContent=description;
document.querySelector('.rail nav a[href="#'+view+'"]')?.setAttribute('aria-current','page');
get('criteria').hidden=view!=='search';
for(const stage of stages)get('filter').add(new Option(stage,stage));
function filtered(orders){
 const keyword=get('search').value.trim().toUpperCase(),status=get('filter').value;
 return orders.filter(o=>(!status||o.status===status)&&[o.buyer,o.phone,o.id].some(value=>value.toUpperCase().includes(keyword)));
}
function render(){
 if(view==='orders'){
  const overview=get('overview');
  overview.hidden=false;overview.replaceChildren();
  for(const [label,value] of [['待確認',orders.filter(o=>o.status==='待確認').length],['待出貨／取貨',orders.filter(o=>o.status==='已確認').length],['全部訂單',orders.length]]){
   const card=document.createElement('div'),number=document.createElement('strong');
   number.textContent=value;card.append(label,number);overview.append(card);
  }
 }

 if(view==='revenue'){
 const active=orders.filter(o=>o.status!=='已取消');
 const sum=list=>list.reduce((total,o)=>total+(o.total??o.subtotal),0);
 get('stats').replaceChildren();
 for(const [label,value] of [['有效訂單',active.length],['訂購張數',active.reduce((n,o)=>n+o.qty,0)],['訂單金額',money(sum(active))],['實收金額',money(sum(orders.filter(o=>o.paid)))],['待收金額',money(sum(active.filter(o=>!o.paid)))],['會員人數',members.length]]){
  const box=document.createElement('div'),amount=document.createElement('strong');
  amount.textContent=value;box.append(label,amount);get('stats').append(box);
 }
 return;
 }
 if(view==='members'){
  get('members').replaceChildren();
  for(const member of members){const p=document.createElement('p');p.textContent=member.name+'｜'+member.phone+'｜'+(member.lineId?'LINE 已綁定':'未綁定');get('members').append(p)}
  if(!members.length)get('members').textContent='目前沒有會員。';
  return;
 }
 get('orders').replaceChildren();
 const list=view==='search'?filtered(orders):[...orders].sort((a,b)=>Number(['待確認','已確認'].includes(b.status))-Number(['待確認','已確認'].includes(a.status)));
 for(const o of list){
  const box=document.createElement('article'),detail=document.createElement('p'),actions=document.createElement('div');
  box.className='order';actions.className='actions';
  const top=document.createElement('div'),title=document.createElement('strong'),badge=document.createElement('span');
  top.className='orderTop';badge.className='pill';badge.dataset.status=o.status;
  title.textContent=o.buyer+' · '+o.id;badge.textContent=o.status;top.append(title,badge);
  detail.textContent=[o.phone,(o.productName||'蔥酥小餅')+' × '+o.qty,money(o.total??o.subtotal),o.paid?'已收款':'未收款',shippingNote(o),o.receiver,o.address,o.note,o.gift?'贈 '+o.gift:''].filter(Boolean).join('｜');
  function action(label,change){
   const button=document.createElement('button');
   button.textContent=label;
   button.onclick=async()=>{
    if(change.status==='已取消'&&!window.confirm('確定取消這筆訂單？'))return;
    for(const item of actions.children)item.disabled=true;
    try{await api('admin/update',{id:o.id,...change});await reload();}
    catch(error){showError(error);}
    finally{for(const item of actions.children)item.disabled=false;}
   };
   actions.append(button);
  }
  if(view==='orders'){
   if(o.status==='待確認'){action('確認訂單',{status:'已確認'});action('取消訂單',{status:'已取消'});}
   if(o.status==='已確認')action(o.delivery==='ship'?'標記已出貨':'標記已取貨',{status:o.delivery==='ship'?'已出貨':'已取貨'});
  }
  if(o.status!=='已取消')action(o.paid?'取消收款標記':'標記已收款',{paid:!o.paid});
  box.append(top,detail,actions);get('orders').append(box);
 }
 if(!get('orders').children.length)get('orders').textContent='目前沒有符合條件的訂單。';
}
if(get('admin')){
get('search').oninput=get('filter').onchange=render;
get('export').onclick=()=>{
 const rows=[['單號','日期','姓名','電話','商品','單價','張數','商品小計','運費','合計','取貨方式','收件人','地址','狀態','商品款','備註'],...filtered(orders).map(o=>[o.id,o.date,o.buyer,o.phone,o.productName||'蔥酥小餅',o.unitPrice??25,o.qty,o.subtotal,o.freight??0,o.total??o.subtotal,shippingNote(o),o.receiver,o.address,o.status,o.paid?'已收':'未收',o.note])];
 const csv=rows.map(row=>row.map(value=>{const s=String(value??'');return '"'+(/^[\s]*[=+@-]|^[\t\r\n]/.test(s)?"'":'')+s.replaceAll('"','""')+'"'}).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='scallion-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
adminReady.then(ready=>{if(!ready)return;
async function checkSessions(){
 if(view!=='sessions'){await api('admin/session/ping');return;}
 const items=await api('admin/session/list');
 if(view!=='sessions')return;
 const panel=get('sessions');panel.hidden=false;panel.replaceChildren();
 for(const item of items){
  const row=document.createElement('article'),info=document.createElement('p'),button=document.createElement('button');
  row.className='order';info.textContent=item.email+'｜'+item.device+'｜登入 '+new Date(item.started).toLocaleString('zh-TW')+'｜最後活動 '+new Date(item.lastSeen).toLocaleTimeString('zh-TW')+(item.current?'｜目前裝置':'');
  button.textContent='踢下線';button.disabled=item.current;
  button.onclick=async()=>{if(!confirm('要將這個裝置踢下線嗎？'))return;button.disabled=true;try{await api('admin/session/revoke',{id:item.id});await checkSessions();}catch(error){showError(error);button.disabled=false;}};
  row.append(info,button);panel.append(row);
 }
}
setInterval(()=>checkSessions().catch(showError),20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkSessions().catch(showError);});
if(view==='sessions'){checkSessions().catch(showError);return;}

if(view==='products'){
 const form=get('productForm');
 form.hidden=false;
 const catalog=get('catalog'), preview=get('imagePreview');
 catalog.hidden=false;
 let image='';
 function edit(product){
  form.reset();
  form.elements.id.value=product?.id||'';
  form.elements.name.value=product?.name||'';
  form.elements.price.value=product?.price||'';
  form.elements.active.checked=product?.active??true;
  image=product?.image||'';
  preview.src=image;preview.hidden=!image;
  get('editorTitle').textContent=product?'編輯商品':'新增商品';
 }
 get('newProduct').onclick=()=>edit();
 form.elements.image.onchange=async()=>{
  const file=form.elements.image.files[0];
  if(!file)return;
  try{
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024)throw new Error('請選擇 10 MB 內的 JPG、PNG 或 WebP。');
   const bitmap=await createImageBitmap(file),scale=Math.min(1,800/Math.max(bitmap.width,bitmap.height));
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(bitmap.width*scale));canvas.height=Math.max(1,Math.round(bitmap.height*scale));
   canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
   image=canvas.toDataURL('image/webp',0.82);preview.src=image;preview.hidden=false;
  }catch(error){form.elements.image.value='';showError(error);}
 };
 async function listCatalog(){
  catalog.replaceChildren();
  for(const product of await api('admin/catalog')){
   const row=document.createElement('p'),button=document.createElement('button');
   row.textContent=product.name+'｜'+money(product.price)+'｜'+(product.active?'上架':'下架')+' ';
   button.textContent='編輯';button.onclick=()=>edit(product);
   if(product.image){
    const thumb=document.createElement('img');thumb.src=product.image;thumb.alt='';row.prepend(thumb);
   }
   row.append(button);catalog.append(row);
  }
 }
 listCatalog().catch(showError);
 submit('productForm',async data=>{
  const product=await api('admin/product',{...data,image});
  edit(product);await listCatalog();
  get('productSaved').textContent='已儲存商品。';
 });
 const storeForm=get('storeForm');
 storeForm.hidden=false;
 function fillStore(settings){
  for(const key of ['gift','threshold','start','end','shippingFee','freeShipping'])storeForm.elements[key].value=settings[key]??'';
  for(const key of ['accepting','enabled'])storeForm.elements[key].checked=settings[key];
  get('saveStore').disabled=false;
 }
 api('admin/store').then(fillStore).catch(showError);
 submit('storeForm',async data=>{
  fillStore(await api('admin/store',data));
  get('storeSaved').textContent='已儲存接單與活動設定。';
 });
}else reload().catch(showError);});}
else quote();
</script></html>
